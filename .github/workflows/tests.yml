name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The checker's tests pass
        run: python3 -m unittest discover -s tests

  dotnet-standards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dotnet-standards
    steps:
      - uses: actions/checkout@v4
      - name: Every skill is referred to by a standard, and every reference resolves
        run: python3 scripts/check_references.py
      - name: The reference check's tests pass
        run: python3 -m unittest discover -s tests
